<!-- Cabeçalho da Aplicação (Fora da Box) -->
<div class="header-section mb-3">
    <h1 class="display-5 font-weight-bold text-dark mb-1">MemeMaker</h1>
    <p class="lead text-muted small">Criador de meme rápido e fácil.</p>
</div>

<!-- Box Principal da Aplicação -->
<div class="meme-editor-app-box py-4 px-4 bg-white border rounded shadow-sm">
    <form method="POST" enctype="multipart/form-data" id="memeForm">
        {% csrf_token %}
        <div class="row">
            <!-- Área de Visualização (Preview) -->
            <div class="col-lg-8">
                <div id="meme-preview-container" class="card shadow-sm border-0 bg-dark text-white text-center d-flex flex-column h-100" style="transition: all 0.3s ease; min-height: 400px;">
                    <div class="card-body d-flex flex-column align-items-center justify-content-center w-100 flex-grow-1 p-0">
                        <div id="meme-preview-area" class="w-100 h-100 d-flex align-items-center justify-content-center flex-grow-1">
                            <!-- Placeholder da Imagem (UX Melhorada) -->
                            <div id="placeholder-content" class="text-center p-5 w-100 h-100 d-flex flex-column align-items-center justify-content-center" style="border: 2px dashed rgba(255,255,255,0.2); border-radius: 15px; background: rgba(255,255,255,0.02); transition: all 0.3s ease;">
                                <div class="icon-wrapper mb-3 p-4 rounded-circle" style="background: rgba(255,255,255,0.05);">
                                    <i class="fas fa-cloud-upload-alt fa-4x text-primary opacity-75"></i>
                                </div>
                                <h5 class="font-weight-bold text-white mb-2">Selecione uma Imagem</h5>
                                <p class="mb-0 text-muted small px-4">Clique no botão "Selecionar imagem" à direita para começar a criar seu meme personalizado.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Ferramentas de Edição -->
            <div class="col-lg-4 mt-4 mt-lg-0">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white border-bottom-0 pt-4">
                        <h5 class="mb-0 font-weight-bold text-primary">Ferramentas</h5>
                    </div>
                    <div class="card-body">
                        <div id="editor-tools">
                            <p class="text-muted small mb-4">Siga os passos para criar seu meme.</p>
                            
                            <!-- Passo 1: Imagem -->
                            <div class="form-group mb-4">
                                <label class="font-weight-bold d-block">1. Escolha a Imagem</label>
                                <div class="custom-file">
                                    <input type="file" name="image" class="custom-file-input" id="imageUpload" accept="image/*" required>
                                    <label class="custom-file-label" for="imageUpload">Selecionar imagem...</label>
                                </div>
                                <small class="form-text text-muted">Formatos aceitos: JPG, PNG, WEBP.</small>
                            </div>

                            <!-- Passo 2: Textos -->
                            <div class="form-group mb-3">
                                <label class="font-weight-bold">2. Adicione os Textos</label>
                                <input type="text" name="top_text" class="form-control mb-2" id="topTextInput" placeholder="Texto do topo">
                                <input type="text" name="bottom_text" class="form-control" id="bottomTextInput" placeholder="Texto de baixo">
                            </div>

                            <!-- Botão de Ação -->
                            <button type="submit" class="btn btn-primary btn-block mt-4 py-2 font-weight-bold">
                                <i class="fas fa-download mr-2"></i>Gerar e Baixar Meme
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </form>
</div>
